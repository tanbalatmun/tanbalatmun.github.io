# Supabase pauses free projects after about a week without activity.
# This makes one tiny read request every 2 days so the database stays awake.
# Run it by hand: GitHub → Actions → "Keep Supabase awake" → Run workflow.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 */2 * *"   # 06:17 UTC every 2 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping the database
        run: |
          # Read the public URL and anon key from the site's own config (both are public by design).
          URL=$(grep -oE 'SUPABASE_URL: *"[^"]+"' assets/js/config.js | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'SUPABASE_ANON_KEY: *"[^"]+"' assets/js/config.js | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "No Supabase settings in config.js"; exit 1; fi

          STATUS=$(curl -sS -o response.txt -w '%{http_code}' \
            "$URL/rest/v1/site_content?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered HTTP $STATUS"
          cat response.txt; echo

          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase did not answer normally. If the project is paused, restore it at https://supabase.com/dashboard"
            exit 1
          fi
